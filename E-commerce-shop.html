<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce Store</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

  

    header{
      background:#111;
      color:rgb(5, 154, 183);
      padding:15px 25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
    }

    .cart{
      background:#ff9800;
      padding:10px 18px;
      border-radius:6px;
      font-size:18px;
      font-weight:bold;
    }

    

    .container{
      width:90%;
      margin:30px auto;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
      text-align:center;
    }

    .card-content h3{
      margin-bottom:10px;
    }

    .price{
      color:green;
      font-size:22px;
      margin-bottom:15px;
      font-weight:bold;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
      margin-top:10px;
    }

    .add-btn{
      background:#111;
      color:white;
    }

    .buy-btn{
      background:green;
      color:white;
    }

    .remove-btn{
      background:red;
      color:white;
      width:auto;
      padding:8px 12px;
    }

    

    .cart-section{
      background:white;
      margin-top:40px;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .cart-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 0;
      border-bottom:1px solid #ddd;
    }

    .total{
      margin-top:20px;
      font-size:24px;
      color:green;
      font-weight:bold;
      text-align:right;
    }

   

    .modal{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .modal-box{
      background:white;
      width:100%;
      max-width:400px;
      padding:25px;
      border-radius:10px;
    }

    .modal-box h2{
      text-align:center;
      margin-bottom:20px;
    }

    .modal-box input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:5px;
    }

    .pay-btn{
      background:green;
      color:white;
    }

    .close-btn{
      background:red;
      color:white;
    }

    .success{
      background:green;
      color:white;
      padding:15px;
      text-align:center;
      margin-top:20px;
      border-radius:5px;
      display:none;
    }


    @media(max-width:768px){

      header{
        flex-direction:column;
        gap:15px;
      }

      .cart-item{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
      }

      .remove-btn{
        width:100%;
      }

      .total{
        text-align:left;
      }

    }

  </style>

</head>

<body>

 

  <header>

    <div class="logo">E-commerce</div>

    <div class="cart">
      Cart: <span id="cartCount">0</span>
    </div>

  </header>


  <div class="container">

    <div class="products">

     

      <div class="card">

        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">

        <div class="card-content">

          <h3>Headphones</h3>

          <div class="price">₹1999</div>

          <button class="add-btn"
          onclick="addItem('Headphones',1999)">
            Add To Cart
          </button>

        </div>

      </div>

     
      <div class="card">

        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">

        <div class="card-content">

          <h3>Smart Watch</h3>

          <div class="price">₹2999</div>

          <button class="add-btn"
          onclick="addItem('Smart Watch',2999)">
            Add To Cart
          </button>

        </div>

      </div>

      

      <div class="card">

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

        <div class="card-content">

          <h3>Running Shoes</h3>

          <div class="price">₹2499</div>

          <button class="add-btn"
          onclick="addItem('Running Shoes',2499)">
            Add To Cart
          </button>

        </div>

      </div>


      <div class="card">

        <img src="https://images.unsplash.com/photo-1581605405669-fcdf81165afa">

        <div class="card-content">

          <h3>Backpack</h3>

          <div class="price">₹1499</div>

          <button class="add-btn"
          onclick="addItem('Backpack',1499)">
            Add To Cart
          </button>

        </div>

      </div>

    </div>


    <div class="cart-section">

      <h2>Shopping Cart</h2>

      <div id="cartItems"></div>

      <div class="total">
        Total: ₹<span id="totalPrice">0</span>
      </div>

      <button class="buy-btn" onclick="openPayment()">
        Buy Now
      </button>

      <div class="success" id="successMessage">
        Payment Successful ✅
      </div>

    </div>

  </div>

 

  <div class="modal" id="paymentModal">

    <div class="modal-box">

      <h2>Payment Form</h2>

      <input type="text" placeholder="Card Holder Name">

      <input type="text" placeholder="Card Number">

      <input type="text" placeholder="Expiry Date">

      <input type="password" placeholder="CVV">

      <button class="pay-btn" onclick="payNow()">
        Pay Now
      </button>

      <button class="close-btn" onclick="closePayment()">
        Cancel
      </button>

    </div>

  </div>
  <script>

    let cartCount = 0;
    let total = 0;

    function addItem(name, price){

      cartCount++;

      total = total + price;

      document.getElementById("cartCount").innerText = cartCount;

      document.getElementById("totalPrice").innerText = total;

      let cartBox = document.createElement("div");

      cartBox.className = "cart-item";

      cartBox.innerHTML = `
        <span>${name} - ₹${price}</span>

        <button class="remove-btn"
        onclick="removeItem(this, ${price})">
          Remove
        </button>
      `;

      document.getElementById("cartItems").appendChild(cartBox);
    }
     function removeItem(button, price){
      button.parentElement.remove();
      cartCount--;
      total = total - price;
      document.getElementById("cartCount").innerText = cartCount;

      document.getElementById("totalPrice").innerText = total;

    }

    function openPayment(){

      if(cartCount == 0){

        alert("Cart is Empty");

      }else{

        document.getElementById("paymentModal").style.display = "flex";

      }

    }

    function closePayment(){

      document.getElementById("paymentModal").style.display = "none";

    }

    function payNow(){

      document.getElementById("paymentModal").style.display = "none";

      document.getElementById("successMessage").style.display = "block";

    }
  </script>
</body>
</html>
